spring:
  application:
    name: notification-service      # Config Server에서 이 이름으로 파일 조회
  config:
    import: "configserver:"         # Config Server에서 설정 가져옴
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: false
      retry:
        max-attempts: 3
        initial-interval: 1000

  # Jackson (MSA 환경 안전 설정 — Config Server에서 관리하지 않는 앱 레벨 설정)
  jackson:
    deserialization:
      fail-on-unknown-properties: false   # 모르는 필드 무시
    serialization:
      write-dates-as-timestamps: false    # LocalDateTime → ISO-8601 문자열
