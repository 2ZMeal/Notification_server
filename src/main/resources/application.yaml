spring:
  application:
    name: notification-service      # Config Server에서 이 이름으로 파일 조회
  config:
    import: "configserver:"         # Config Server에서 설정 가져옴
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: false
      retry:
        max-attempts: 3
        initial-interval: 1000

  # Kafka Consumer
  kafka:
    consumer:
      group-id: notification-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # Mail
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM:noreply@ezmeal.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Jackson
  jackson:
    deserialization:
      fail-on-unknown-properties: false   # 모르는 필드 무시
    serialization:
      write-dates-as-timestamps: false    # LocalDateTime → ISO-8601 문자열
